services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: passmark
      POSTGRES_PASSWORD: passmark
      POSTGRES_DB: passmark
    ports:
      - "5432:5432"
    volumes:
      - ./storage/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passmark -d passmark"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ./storage/ollama:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "1m"
      OLLAMA_LOAD_TIMEOUT: "5m"
      CUDA_VISIBLE_DEVICES: ""
      NVIDIA_VISIBLE_DEVICES: "none"
    mem_limit: 5g
    memswap_limit: 5g
    cpus: "2.0"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 18

  ollama-model:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${LOCAL_AI_MODEL:-qwen2.5-coder:1.5b}"]
    restart: "no"
    mem_limit: 4g
    memswap_limit: 4g
    cpus: "1.0"

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-model:
        condition: service_completed_successfully
    environment:
      PORT: 5000
      PASSMARK_CONTAINERIZED: "true"
      PASSMARK_SECRET_KEY: ${PASSMARK_SECRET_KEY:-}
      DATABASE_URL: postgresql://passmark:passmark@postgres:5432/passmark
      LOCAL_AI_PROVIDER: ollama
      LOCAL_AI_BASE_URL: http://ollama:11434
      LOCAL_AI_API_KEY: ollama
      LOCAL_AI_MODEL: ${LOCAL_AI_MODEL:-qwen2.5-coder:1.5b}
      LOCAL_AI_TIMEOUT_MS: ${LOCAL_AI_TIMEOUT_MS:-180000}
      LOCAL_AI_MAX_TOKENS: ${LOCAL_AI_MAX_TOKENS:-768}
      LOCAL_AI_CONTEXT_TOKENS: ${LOCAL_AI_CONTEXT_TOKENS:-2048}
      LOCAL_AI_NUM_THREAD: ${LOCAL_AI_NUM_THREAD:-2}
      LOCAL_AI_TEMPERATURE: ${LOCAL_AI_TEMPERATURE:-0.2}
      LOCAL_AI_KEEP_ALIVE: ${LOCAL_AI_KEEP_ALIVE:-1m}
      LOCAL_AI_CASES_PER_BATCH: ${LOCAL_AI_CASES_PER_BATCH:-2}
      LOCAL_AI_BATCH_TIMEOUT_MS: ${LOCAL_AI_BATCH_TIMEOUT_MS:-90000}
      LOCAL_AI_BATCH_MAX_TOKENS: ${LOCAL_AI_BATCH_MAX_TOKENS:-512}
    ports:
      - "5000:5000"
    volumes:
      - ./storage:/app/storage
      - ./test-results:/app/test-results
      - ./playwright-report:/app/playwright-report
    extra_hosts:
      - "host.docker.internal:host-gateway"
